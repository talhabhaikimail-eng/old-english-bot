name: Discord WhatsApp Bridge

on:
  push:
    branches: [main] # Restart bridge on every push to main
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: "0 */5 * * *" # Fallback in case the self-trigger fails

jobs:
  run-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 310 # 5 hours + 10 min buffer for setup/teardown

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cancel previous bridge runs
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "🔍 Checking for concurrent discord-whatsapp-bridge runs..."
          if [ -n "$PAT_TOKEN" ]; then
            RUNS_JSON=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PAT_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bridge.yml/runs?per_page=30")

            # Newest run always wins: if a newer run exists, cancel this one instead
            NEWER_IDS=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.status != "completed" and .id > ${{ github.run_id }}) | .id')
            if [ -n "$NEWER_IDS" ]; then
              echo "🛑 Newer bridge run exists ($NEWER_IDS), cancelling this run..."
              curl -s -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $PAT_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" > /dev/null || true
              sleep 60
              exit 1
            fi

            OTHER_IDS=$(echo "$RUNS_JSON" | jq -r '.workflow_runs[] | select(.status != "completed" and .id < ${{ github.run_id }}) | .id')
            for RUN_ID in $OTHER_IDS; do
              if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
                echo "🛑 Cancelling old bridge run ID $RUN_ID..."
                curl -s -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $PAT_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/cancel" > /dev/null || true
              fi
            done
          fi

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Prepare runtime folders
        run: mkdir -p auth_info browser_data

      - name: Prepare credentials
        env:
          CREDS_JSON: ${{ secrets.CREDS_JSON }}
        run: |
          printf '%s' "$CREDS_JSON" > auth_info/creds.json
          echo "✅ credentials prepared"

      - name: Prepare environment
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s' "$ENV_FILE" > .env.secret
          cp .env.secret .env
          source .env.secret
          echo "::add-mask::$DASHBOARD_DOMAIN"
          echo "::add-mask::$R2_ACCOUNT_ID"
          echo "::add-mask::$R2_BUCKET_NAME"
          echo "::add-mask::$R2_ACCESS_KEY_ID"
          echo "::add-mask::$R2_SECRET_ACCESS_KEY"
          echo "::add-mask::$PAT_TOKEN"
          echo "::add-mask::$WHATSAPP_PHONE"
          echo "::add-mask::$BROWSER_PASSWORD"
          echo "::add-mask::$DASHBOARD_PASSWORD"
          echo "✅ environment prepared"

      - name: Prepare storage connection
        run: |
          source .env.secret
          aws configure set default.s3.signature_version s3v4
          aws configure set aws_access_key_id ${R2_ACCESS_KEY_ID}
          aws configure set aws_secret_access_key ${R2_SECRET_ACCESS_KEY}
          aws configure set default.region auto

      - name: Sync storage state
        run: |
          source .env.secret
          echo "📥 Downloading latest state..."
          aws s3 cp s3://${R2_BUCKET_NAME}/state.tar.gz state.tar.gz --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com || echo "No previous state found."
          if [ -f "state.tar.gz" ]; then
            echo "📦 Extracting state..."
            tar -xzf state.tar.gz -C $(pwd) --overwrite || echo "Failed to extract state"
          fi

      - name: Consolidate configuration
        run: |
          if [ -f ".env.secret" ]; then
            echo "🔄 Merging GitHub secrets into .env..."
            node -e "
              const fs = require('fs');

              function parseEnv(filePath) {
                if (!fs.existsSync(filePath)) return {};
                const content = fs.readFileSync(filePath, 'utf8');
                const config = {};
                content.split('\n').forEach(line => {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith('#')) return;
                  const eqIdx = trimmed.indexOf('=');
                  if (eqIdx !== -1) {
                    const k = trimmed.substring(0, eqIdx).trim();
                    const v = trimmed.substring(eqIdx + 1).trim();
                    config[k] = v;
                  }
                });
                return config;
              }

              const r2Env = parseEnv('.env');
              const secretEnv = parseEnv('.env.secret');
              const merged = { ...r2Env, ...secretEnv };

              let output = '';
              for (const [k, v] of Object.entries(merged)) {
                let val = v;
                if (val.includes(' ') && !((val.startsWith('"') && val.endsWith('"')) || (val.startsWith('\'') && val.endsWith('\'')))) {
                  val = \`"\${val}"\`;
                }
                output += \`\${k}=\${val}\n\`;
              }
              fs.writeFileSync('.env', output, 'utf8');
              console.log('✅ .env merged successfully');
            "
          fi

      - name: Install dependencies
        run: |
          for i in 1 2 3 4 5; do
            npm ci && break
            if [ "$i" -eq 5 ]; then exit 1; fi
            echo "⚠️ npm ci failed (attempt $i), retrying in 30s..."
            sleep 30
          done

      - name: Build project
        run: npm run build

      - name: Install & build dashboard
        run: |
          npm run dashboard:install
          npm run dashboard:build
          echo "✅ Dashboard built"

      - name: Get runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore system packages
        id: apt-debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.image.outputs.version }}-ffmpeg-libsox-dev-wkhtmltopdf-xvfb

      - name: Install System Dependencies
        run: |
          PKGS="ffmpeg libsox-dev wkhtmltopdf xvfb"
          # Skip the slow man page index rebuild during install
          sudo rm -f /var/lib/man-db/auto-update
          if [ "${{ steps.apt-debs.outputs.cache-hit }}" = "true" ] && sudo apt-get install -y --no-download ~/apt-debs/*.deb; then
            echo "✅ Installed from cached packages"
          else
            sudo apt-get update
            sudo apt-get install -y --download-only $PKGS
            mkdir -p ~/apt-debs
            cp /var/cache/apt/archives/*.deb ~/apt-debs/ || true
            sudo apt-get install -y $PKGS
          fi

      # Saved immediately (not in a post step) because bridge runs usually end cancelled
      - name: Save system packages
        if: steps.apt-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-debs.outputs.cache-primary-key }}

      - name: Start VNC and Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Restore Go binaries
        id: go-bins
        uses: actions/cache/restore@v4
        with:
          path: |
            container-manager
            contact-scraper
            cv-server
          key: go-bins-${{ runner.os }}-${{ hashFiles('src-go/container-manager/**', 'src-go/contact-scraper/**', 'src-go/create-cv/**') }}

      - name: Prepare Go environment
        if: steps.go-bins.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'src-go/container-manager/go.mod'
          cache-dependency-path: src-go/container-manager/go.sum

      - name: Build Go binaries
        if: steps.go-bins.outputs.cache-hit != 'true'
        run: |
          (cd src-go/container-manager && go build -o ../../container-manager .) & P1=$!
          (cd src-go/contact-scraper && go build -o ../../contact-scraper .) & P2=$!
          (cd src-go/create-cv && go build -o ../../cv-server .) & P3=$!
          wait $P1 && wait $P2 && wait $P3

      # Saved immediately (not in a post step) because bridge runs usually end cancelled
      - name: Save Go binaries
        if: steps.go-bins.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            container-manager
            contact-scraper
            cv-server
          key: ${{ steps.go-bins.outputs.cache-primary-key }}

      - name: Start session manager
        run: |
          chmod +x container-manager
          ./container-manager > container-manager.log 2>&1 &

          SUCCESS=0
          for i in {1..10}; do
            # /health doesn't wait on the sessions lock held by the startup reconcile
            if curl -s --max-time 2 http://127.0.0.1:18080/api/go/containers/health > /dev/null; then
              SUCCESS=1
              break
            fi
            sleep 1
          done
          if [ $SUCCESS -ne 1 ]; then
            exit 1
          fi

      - name: Start contact scraper
        run: |
          chmod +x contact-scraper
          PORT=8081 ./contact-scraper > contact-scraper.log 2>&1 &

          SUCCESS=0
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8081/health > /dev/null; then
              SUCCESS=1
              break
            fi
            sleep 1
          done
          if [ $SUCCESS -ne 1 ]; then
            exit 1
          fi

      - name: Start CV generator server
        run: |
          chmod +x cv-server
          PORT=8082 xvfb-run ./cv-server > cv-server.log 2>&1 &

          SUCCESS=0
          for i in {1..10}; do
            if curl -s http://127.0.0.1:8082/health > /dev/null; then
              SUCCESS=1
              break
            fi
            sleep 1
          done
          if [ $SUCCESS -ne 1 ]; then
            exit 1
          fi

      - name: Execute bridge process
        run: |
          (sleep 17100 && \
            sudo tar -czf /tmp/state_pretrigger.tar.gz -C $(pwd) auth_info && \
            sudo chmod 666 /tmp/state_pretrigger.tar.gz && \
            source .env && \
            aws s3 cp /tmp/state_pretrigger.tar.gz s3://${R2_BUCKET_NAME}/state.tar.gz \
              --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com && \
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bridge.yml/dispatches \
              -d '{"ref":"${{ github.ref_name }}"}') &

          MODE=whatsapp timeout 18000 npm start > bridge.log 2>&1; code=$?

          if [ "$code" -eq 124 ]; then
            echo "⏱️ Process cleanly stopped after 5 hours."
          elif [ "$code" -eq 0 ]; then
            echo "✅ Process completed normally."
          else
            echo "❌ Process failed with exit code $code"
          fi
          exit 0

      - name: Sync storage teardown
        if: always()
        run: |
          sudo tar -czf state.tar.gz -C $(pwd) auth_info || echo "Tar completed with warnings"
          sudo chmod 666 state.tar.gz

          if [ -f ".env" ]; then
            source .env
            echo "📤 Uploading final state to R2..."
            aws s3 cp state.tar.gz s3://${R2_BUCKET_NAME}/state.tar.gz --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

            echo "📤 Uploading logs to R2..."
            for logfile in bridge.log container-manager.log contact-scraper.log; do
              if [ -f "$logfile" ]; then
                aws s3 cp "$logfile" "s3://${R2_BUCKET_NAME}/logs/bridge-${{ github.run_id }}-$logfile" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" || echo "Failed to upload $logfile"
              fi
            done
          fi
